site_name: geno-mon
site_description: Agent observability for agentic harnesses
site_url: https://42euge.github.io/geno-mon/
repo_url: https://github.com/42euge/geno-mon
repo_name: 42euge/geno-mon

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
    - toc.follow
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Getting Started:
    - Installation & First Run: getting-started.md
    - Concepts: concepts.md
  - Commands:
    - Overview: commands/index.md
    - list: commands/list.md
    - tail: commands/tail.md
  - Reference:
    - Metrics: reference/metrics.md
    - JSON Schema: reference/json-schema.md
    - Session Logs: reference/session-logs.md
  - Project:
    - Contributing: contributing.md
    - Roadmap: roadmap.md

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/42euge/geno-mon
